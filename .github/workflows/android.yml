name: App Android (APK)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK Android (já vem no runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar app web (www/)
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícone e tela de abertura
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e0e0e' --splashBackgroundColor '#0e0e0e' --splashBackgroundColorDark '#0e0e0e'

      - name: Sincronizar
        run: npx cap sync android

      - name: Versão (sobe sozinha a cada build)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Restaurar chave dos Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          : "${KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Configure ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.keystore"

      - name: Configurar assinatura sem gravar senhas
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  secure {
                      storeFile file(System.getenv('RUNNER_TEMP') + '/signing.keystore')
                      storePassword System.getenv('STORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.secure }
              }
          }
          GRADLE

      - name: Gerar APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Limpar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk calculadora-zicao.apk

      - name: Publicar no GitHub (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Calculadora do Zicão — Android
          body: |
            Versão 1.${{ github.run_number }}
            Baixe o **calculadora-zicao.apk** no celular Android e instale.
          files: calculadora-zicao.apk
          make_latest: true
