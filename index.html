<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e0e;}

/* GRADIENT BORDER WRAPPER */
#outer{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#1a1400 0%,#6b4f00 25%,#c9a000 50%,#6b4f00 75%,#0e0e0e 100%);
  padding:2px;
}
#app{
  position:absolute;inset:2px;
  display:flex;flex-direction:column;
  background:#0e0e0e;
  font-family:'Syne',sans-serif;
  overflow:hidden;
}

/* ORBS */
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;animation:drift 8s ease-in-out infinite alternate;}
.orb1{width:300px;height:300px;background:#c9a000;top:-80px;left:-60px;animation-duration:9s;}
.orb2{width:250px;height:250px;background:#444;bottom:-60px;right:-60px;animation-duration:11s;animation-delay:-3s;}
.orb3{width:180px;height:180px;background:#1a1a1a;top:45%;left:55%;animation-duration:7s;animation-delay:-5s;}
@keyframes drift{from{transform:translate(0,0);}to{transform:translate(25px,18px);}}

/* TITLE */
#titleRow{
  display:flex;align-items:center;gap:7px;
  padding:env(safe-area-inset-top,10px) 12px 10px;
  flex-shrink:0;overflow:hidden;
}
.tdot{width:8px;height:8px;border-radius:50%;background:#f5c518;box-shadow:0 0 10px #f5c518;flex-shrink:0;}
.ttxt{font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.65);white-space:nowrap;padding:5px 11px;border-radius:8px;background:linear-gradient(#0e0e0e,#0e0e0e) padding-box,linear-gradient(135deg,#1a1400,#8a6500 35%,#f5c518 60%,#8a6500 80%,#1a1400) border-box;border:1px solid transparent;}
.mbtn{background:none;border:1px solid rgba(245,197,24,.35);border-radius:8px;color:rgba(245,197,24,.65);cursor:pointer;padding:5px 9px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .2s;flex-shrink:0;white-space:nowrap;}
.mbtn.sci{background:rgba(245,197,24,.12);color:#f5c518;border-color:#c9a000;}
.hbtn{background:none;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:rgba(255,255,255,.45);cursor:pointer;padding:5px 9px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:5px;transition:all .2s;flex-shrink:0;white-space:nowrap;}
.hbtn.active{color:#f5c518;border-color:#c9a000;background:rgba(245,197,24,.1);}
.hbadge{background:#f5c518;color:#111;border-radius:4px;font-size:9px;font-weight:800;padding:1px 6px;min-width:18px;text-align:center;}
.gbtn{background:none;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:rgba(255,255,255,.4);cursor:pointer;padding:5px 8px;font-size:13px;line-height:1;flex-shrink:0;transition:all .2s;}

/* SCREEN */
#screen{
  background:linear-gradient(170deg,rgba(18,14,0,.9),rgba(8,7,0,.95));
  border:1px solid rgba(245,197,24,.12);
  border-radius:20px;
  padding:14px 18px 12px;
  margin:0 12px 8px;
  min-height:120px;
  display:flex;flex-direction:column;justify-content:space-between;
  flex-shrink:0;overflow:hidden;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5);
}
.scr-top{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:8px;}
.swipe-hint{font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,.1);letter-spacing:1px;white-space:nowrap;margin-top:2px;flex-shrink:0;}
#expr{font-family:'DM Mono',monospace;font-weight:400;font-size:12px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right;color:rgba(180,140,0,.5);transition:font-size .15s,color .15s;}
#expr.on{color:rgba(245,210,80,.85);font-size:clamp(13px,3.8vw,18px);}
#live{font-family:'DM Mono',monospace;font-size:11px;color:rgba(245,197,24,.35);text-align:right;min-height:14px;margin-top:2px;}
#live.on{color:rgba(245,197,24,.65);}
.scr-bot{display:flex;align-items:flex-end;justify-content:space-between;width:100%;gap:8px;margin-top:6px;}
#cpyBtn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(255,255,255,.35);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;cursor:pointer;flex-shrink:0;transition:all .2s;}
#cpyBtn.ok{color:#f5c518;border-color:#c9a000;background:rgba(245,197,24,.1);}
#numDisp{font-family:'DM Mono',monospace;font-weight:400;color:#fff;letter-spacing:-1px;line-height:1;font-size:clamp(44px,12vw,62px);text-shadow:0 0 28px rgba(180,140,0,.4);transition:font-size .1s;}
@keyframes bnc{0%{transform:scale(1);}25%{transform:scale(1.15) translateY(-3px);}55%{transform:scale(.95) translateY(2px);}80%{transform:scale(1.05);}100%{transform:scale(1);}}
.bnc{animation:bnc .4s ease;}

/* SCI PANEL */
#sciRow{display:none;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1.3vw,8px);padding:0 12px 6px;flex-shrink:0;}
#sciRow.on{display:grid;}

/* GRID */
#grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(6,1fr);
  gap:clamp(6px,1.5vw,10px);
  padding:0 12px;
  padding-bottom:env(safe-area-inset-bottom,10px);
  flex:1;
  min-height:0;
}

/* BUTTONS */
.btn{
  border:none;
  cursor:pointer;
  font-family:'DM Mono',monospace;
  font-weight:500;
  font-size:clamp(22px,6vw,32px);
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  border-radius:18px;
  position:relative;overflow:hidden;outline:none;
  transition:transform .08s, box-shadow .08s;
  -webkit-user-select:none;user-select:none;
}
.btn:active{
  transform:translateY(3px) scale(.97);
  box-shadow:none !important;
}
.ripple{position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(255,255,255,.35);animation:rpl .3s ease-out forwards;pointer-events:none;}
@keyframes rpl{from{transform:scale(.4);opacity:1;}to{transform:scale(1.7);opacity:0;}}

/* EXTRA: sqrt x2 ( ) */
.bx{
  background:linear-gradient(180deg,rgba(70,58,10,.9) 0%,rgba(50,40,5,.95) 100%);
  color:rgba(245,210,80,.9);
  font-size:clamp(13px,3.5vw,18px);
  font-family:'Syne',sans-serif;font-weight:700;
  box-shadow:0 4px 0 rgba(20,14,0,.8),inset 0 1px 0 rgba(255,220,80,.15),inset 0 -1px 0 rgba(0,0,0,.3);
}

/* FUNC: AC +/- % */
.bf{
  background:linear-gradient(180deg,rgba(95,95,100,.95) 0%,rgba(68,68,73,.98) 100%);
  color:rgba(235,235,235,.95);
  font-size:clamp(13px,3.5vw,17px);
  font-family:'Syne',sans-serif;font-weight:700;
  box-shadow:0 4px 0 rgba(20,20,22,.9),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.2);
}

/* NUM: 0-9 . */
.bn{
  background:linear-gradient(180deg,rgba(62,62,66,.97) 0%,rgba(44,44,48,.99) 100%);
  color:#f5f5f5;
  box-shadow:0 4px 0 rgba(15,15,17,.95),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.15);
}

/* OP: / * - + = */
.bo{
  background:linear-gradient(180deg,rgba(225,175,0,.97) 0%,rgba(165,122,0,.99) 100%);
  color:#1a0f00;
  font-size:clamp(24px,6.5vw,34px);
  font-weight:300;
  font-family:'DM Mono',monospace;
  box-shadow:0 4px 0 rgba(80,55,0,.95),0 0 22px rgba(245,197,24,.12),inset 0 1px 0 rgba(255,240,100,.3),inset 0 -1px 0 rgba(0,0,0,.15);
}
.bo.act{
  background:linear-gradient(180deg,#f5c518 0%,#c9a000 100%);
  box-shadow:0 2px 0 rgba(80,55,0,.8),0 0 30px rgba(245,197,24,.45),inset 0 1px 0 rgba(255,250,150,.4);
  transform:translateY(2px);
}

/* BACK */
.bb{
  background:linear-gradient(180deg,rgba(78,56,54,.95) 0%,rgba(56,40,38,.98) 100%);
  color:rgba(255,145,125,.9);
  font-size:clamp(18px,5vw,24px);
  box-shadow:0 4px 0 rgba(20,10,10,.9),inset 0 1px 0 rgba(255,145,125,.12),inset 0 -1px 0 rgba(0,0,0,.2);
}

/* SCI buttons */
.bs{
  background:linear-gradient(180deg,rgba(60,48,8,.9) 0%,rgba(44,34,4,.95) 100%);
  color:rgba(245,208,78,.8);
  font-size:clamp(10px,2.8vw,13px);
  font-family:'Syne',sans-serif;font-weight:700;
  border:none;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  cursor:pointer;outline:none;
  position:relative;overflow:hidden;
  transition:transform .08s, box-shadow .08s;
  box-shadow:0 3px 0 rgba(15,10,0,.9),inset 0 1px 0 rgba(255,220,80,.1);
}
.bs:active{transform:translateY(2px) scale(.97);box-shadow:none;}

/* FULL SCREEN PANELS */
.panel{position:fixed;inset:0;z-index:300;background:rgba(7,5,0,.97);display:flex;flex-direction:column;padding:env(safe-area-inset-top,20px) 0 env(safe-area-inset-bottom,0) 0;opacity:0;pointer-events:none;transform:translateY(100%);transition:opacity .25s,transform .3s cubic-bezier(.4,0,.2,1);}
.panel.on{opacity:1;pointer-events:all;transform:translateY(0);}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid rgba(245,197,24,.1);}
.ph-title{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);}
.pclose{background:none;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:rgba(255,255,255,.5);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;cursor:pointer;}
.pbody{flex:1;overflow-y:auto;padding:6px 16px 20px;scrollbar-width:thin;}

/* HISTORY ITEMS */
.hi{padding:12px 0;border-bottom:1px solid rgba(245,197,24,.07);}
.hi:last-child{border-bottom:none;}
.hi-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.hi-date{font-family:'DM Mono',monospace;font-size:10px;color:rgba(245,197,24,.4);}
.hi-note-btn{font-family:'Syne',sans-serif;font-size:9px;color:rgba(245,197,24,.5);border:1px solid rgba(245,197,24,.2);border-radius:4px;padding:1px 6px;cursor:pointer;}
.hi-expr{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.3);text-align:right;word-break:break-all;margin-bottom:2px;}
.hi-result{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:rgba(255,255,255,.9);text-align:right;}
.hi-note{font-family:'Syne',sans-serif;font-size:11px;color:rgba(245,197,24,.6);text-align:right;margin-top:4px;font-style:italic;}
.hi-note-inp{width:100%;background:rgba(245,197,24,.06);border:1px solid rgba(245,197,24,.2);border-radius:8px;color:rgba(255,255,255,.8);font-family:'Syne',sans-serif;font-size:12px;padding:7px 10px;margin-top:6px;outline:none;box-sizing:border-box;}
.hi-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:7px;}
.hi-use{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);border-radius:6px;color:rgba(245,197,24,.8);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:4px 10px;cursor:pointer;}
.hi-cpy{background:rgba(80,180,255,.08);border:1px solid rgba(80,180,255,.2);border-radius:6px;color:rgba(100,190,255,.7);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:4px 10px;cursor:pointer;}
.hi-del{background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.2);border-radius:6px;color:rgba(255,100,80,.7);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:4px 10px;cursor:pointer;}
.h-empty{text-align:center;color:rgba(255,255,255,.2);font-size:13px;padding:30px 0;font-family:'DM Mono',monospace;}

/* SETTINGS */
.cs{font-family:'Syne',sans-serif;font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:rgba(245,197,24,.4);padding:16px 0 8px;}
.cr{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.cl{font-family:'Syne',sans-serif;font-size:14px;color:rgba(255,255,255,.75);}
.cl-d{font-family:'Syne',sans-serif;font-size:14px;color:rgba(255,80,80,.7);}
.cr-d{cursor:pointer;}
.csel{background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.2);border-radius:8px;color:rgba(255,255,255,.8);font-family:'Syne',sans-serif;font-size:12px;padding:6px 10px;outline:none;cursor:pointer;}
.ctog{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
.ctog input{opacity:0;width:0;height:0;}
.cslider{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:26px;transition:.3s;cursor:pointer;}
.cslider::before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.ctog input:checked+.cslider{background:rgba(245,197,24,.7);}
.ctog input:checked+.cslider::before{transform:translateX(18px);}
</style>

<div id="outer">
<div id="app">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

  <!-- TITLE BAR -->
  <div id="titleRow">
    <div class="tdot"></div>

<!-- HISTORY PANEL -->

      <span id="hCount" style="font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.3);"></span>
      <button id="hClearAll" style="background:rgba(255,60,60,.12);border:1px solid rgba(255,60,60,.3);color:rgba(255,100,100,.9);font-family:'DM Mono',monospace;font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;letter-spacing:.03em;" title="Limpar todo o histórico">🧹 Limpar</button>

    </div>

  <div class="pbody" id="hBody"></div>
  <div id="hClearModal" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:10;align-items:center;justify-content:center;border-radius:inherit;">
    <div style="background:#1a1a1a;border:1px solid rgba(255,60,60,.4);border-radius:16px;padding:24px 20px;text-align:center;max-width:240px;margin:auto;">
      <div style="font-size:28px;margin-bottom:10px;">🧹</div>

<!-- SETTINGS PANEL -->

  <div class="ph">
    <span class="ph-title">Configuracoes</span>
    <button class="pclose" id="cClose">Fechar</button>
  </div>
  <div class="pbody">
    <div class="cs">PREFERENCIAS</div>
    <div class="cr"><span class="cl">Vibracao</span><label class="ctog"><input type="checkbox" id="cVib" checked/><span class="cslider"></span></label></div>

    <div class="cr"><span class="cl">Separador decimal</span><select class="csel" id="cDec"><option value="comma">Virgula (1,5)</option><option value="dot">Ponto (1.5)</option></select></div>
    <div class="cr"><span class="cl">Separador de milhares</span><select class="csel" id="cThou"><option value="dot">Ponto (1.000)</option><option value="comma">Virgula (1,000)</option><option value="space">Espaco (1 000)</option><option value="none">Nenhum</option></select></div>
    <div class="cr"><span class="cl">Casas decimais</span><select class="csel" id="cDPlaces"><option value="auto">Automatico</option><option value="0">0</option><option value="2">2</option><option value="4">4</option><option value="6">6</option></select></div>

</select></div>
    <div class="cs">HISTORICO</div>
    <div class="cr cr-d" id="cClearH"><span class="cl-d">Limpar todo o historico</span><span style="color:rgba(255,80,80,.4);font-size:16px;">&#8594;</span></div>

<script>
// \u2500\u2500 LAYOUT BUTTONS \u2500\u2500
var BASIC=[["sqrt","x2","(",")" ],["AC","+/-","%","/"],["7","8","9","*"],["4","5","6","-"],["1","2","3","+"],["0",".","back","="]];
var SCI=[["sin","cos","tan","pi"],["asin","acos","atan","e"],["log","ln","10x","ex"],["abs","mod","x!","pow"]];
var OPS=["/","*","-","+"];
var DLBL={sqrt:"\u221a","x2":"x\u00b2","(":"(",")":")","/":"\u00f7","*":"\u00d7","-":"\u2212","+":"+","back":"\u232b","=":"=","pi":"\u03c0","10x":"10\u02e3","ex":"e\u02e3","x!":"x!","pow":"y\u02e3"};

// \u2500\u2500 STATE \u2500\u2500
var expr='',justEvaled=false,lastResult='0',lastExpr='',openParens=0;
var sciMode=false,showHist=false;
var txStart=null,tyStart=null;
var calcHist=[];
try{calcHist=JSON.parse(localStorage.getItem('ch3')||'[]').filter(function(h){return h&&h.expr&&h.result;});}catch(e){}
var cfg={vib:true,wake:false,dec:'comma',thou:'dot',dp:'auto',theme:'dark'};
try{var _c=JSON.parse(localStorage.getItem('cc3')||'{}');for(var k in _c)if(_c.hasOwnProperty(k))cfg[k]=_c[k];}catch(e){}

// \u2500\u2500 DOM \u2500\u2500
var numEl=document.getElementById('numDisp');
var exprEl=document.getElementById('expr');
var liveEl=document.getElementById('live');
var grid=document.getElementById('grid');
var sciRow=document.getElementById('sciRow');
var histPanel=document.getElementById('histPanel');
var cfgPanel=document.getElementById('cfgPanel');
var histBtn=document.getElementById('histBtn');
var modeBtn=document.getElementById('modeBtn');
var hBody=document.getElementById('hBody');
var hCount=document.getElementById('hCount');

// \u2500\u2500 MATH \u2500\u2500
function dc(n){var s=n.toString(),i=s.indexOf('.');return i<0?0:s.length-i-1;}
function prec(a,b,op){
  if(op==='/')return b?a/b:NaN;
  var f=Math.pow(10,Math.max(dc(a),dc(b)));
  var A=Math.round(a*f),B=Math.round(b*f);
  if(op==='+')return(A+B)/f;if(op==='-')return(A-B)/f;if(op==='*')return(A*B)/(f*f);return NaN;
}
function fact(n){n=Math.round(n);if(n<0||n>170)return NaN;var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function fmtN(n){
  if(!isFinite(n)||isNaN(n))return'Err';
  var s=parseFloat(n.toString());
  if(Math.abs(s)>=1e12)return s.toExponential(3);
  var r=parseFloat(s.toPrecision(10));
  var str=r.toString();
  return str.length>12?parseFloat(s.toPrecision(9)).toString():str;
}
function fmtD(n){
  if(n==='Err'||n==='-')return n;
  var neg=n[0]==='-',abs=neg?n.slice(1):n;
  if(cfg.dp!=='auto'){var num=parseFloat(abs);if(!isNaN(num))abs=num.toFixed(parseInt(cfg.dp));}
  var pts=abs.split('.');
  var ip=pts[0];
  var ts=cfg.thou==='dot'?'.':cfg.thou==='comma'?',':cfg.thou==='space'?' ':'';
  if(ts)ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,ts);
  var ds=cfg.dec==='comma'?',':'.';
  return(neg?'-':'')+ip+(pts[1]!==undefined?ds+pts[1]:'');
}

// \u2500\u2500 SAFE EVAL \u2500\u2500
function safeEval(e){
  if(!e)return null;
  var s=e.replace(/\u00d7/g,'*').replace(/\u00f7/g,'/').replace(/\u2212/g,'-')
         .replace(/\u221a\(/g,'S(').replace(/\u03c0/g,'(3.14159265358979)')
         .replace(/\be\b/g,'(2.71828182845905)')
         .replace(/sin\(/g,'SN(').replace(/cos\(/g,'CS(').replace(/tan\(/g,'TN(')
         .replace(/asin\(/g,'ASN(').replace(/acos\(/g,'ACS(').replace(/atan\(/g,'ATN(')
         .replace(/log\(/g,'LG(').replace(/ln\(/g,'LN(').replace(/abs\(/g,'AB(')
         .replace(/10x\(/g,'TX(').replace(/ex\(/g,'EX(').replace(/x!\(/g,'FC(');
  var pos=0;
  function pk(){return pos<s.length?s[pos]:null;}
  function primary(){
    if(pk()==='-'){pos++;return -primary();}
    var fns={'S(':function(v){return v>=0?Math.sqrt(v):NaN;},'SN(':function(v){return Math.sin(v*Math.PI/180);},'CS(':function(v){return Math.cos(v*Math.PI/180);},'TN(':function(v){return Math.tan(v*Math.PI/180);},'ASN(':function(v){return Math.asin(v)*180/Math.PI;},'ACS(':function(v){return Math.acos(v)*180/Math.PI;},'ATN(':function(v){return Math.atan(v)*180/Math.PI;},'LG(':function(v){return Math.log10(v);},'LN(':function(v){return Math.log(v);},'AB(':function(v){return Math.abs(v);},'TX(':function(v){return Math.pow(10,v);},'EX(':function(v){return Math.exp(v);},'FC(':function(v){return fact(v);}};
    var ks=Object.keys(fns);
    for(var i=0;i<ks.length;i++){if(s.indexOf(ks[i],pos)===pos){pos+=ks[i].length;var v=addSub();if(pk()===')'){pos++;}return fns[ks[i]](v);}}
    if(pk()==='('){pos++;var v=addSub();if(pk()===')'){pos++;}return v;}
    var ns='';while(pos<s.length&&/[0-9.]/.test(s[pos]))ns+=s[pos++];
    if(!ns)throw 0;
    var v=parseFloat(ns);
    if(pos<s.length&&s.charCodeAt(pos)===178){pos++;v=v*v;}
    return v;
  }
  function mulDiv(){var l=primary();while(pk()==='*'||pk()==='/'||pk()==='%'){var op=s[pos++];var r=primary();l=op==='%'?((l%r)+r)%r:prec(l,r,op);}return l;}
  function addSub(){var l=mulDiv();while(pk()==='+'||(pk()==='-')){var op=s[pos++];var _r=mulDiv();l=prec(l,_r,op);}return l;}
  try{var r=addSub();return isFinite(r)&&!isNaN(r)?r:'Err';}catch(e){return null;}
}

// \u2500\u2500 DISPLAY \u2500\u2500
function ltop(){var d=0,p=-1;for(var i=0;i<expr.length;i++){var c=expr[i];if(c==='(')d++;else if(c===')')d--;else if(d===0&&'+-*/\u00d7\u00f7\u2212'.indexOf(c)>=0)p=i;}return p;}
function getNum(){
  if(justEvaled)return lastResult;
  if(!expr)return'0';
  var lt=expr.substring(ltop()+1);if(!lt)return'0';
  var m=lt.match(/^(-?[0-9]+\.?[0-9]*)$/);if(m)return m[1];
  var r=safeEval(lt);return r!==null&&r!=='Err'?fmtN(r):'0';
}
function getExprTxt(){
  if(justEvaled)return lastExpr+' =';
  if(!expr)return'';
  var p=ltop();if(p>=0)return expr.substring(0,p+1);
  var lt=expr.substring(1);if(lt&&lt.match(/[^0-9.\-]/))return expr.substring(0,ltop()+1);
  return'';
}

var _raf=false;
function render(){
  if(_raf)return;_raf=true;
  requestAnimationFrame(function(){
    _raf=false;
    var mn=getNum(),disp=fmtD(mn);
    numEl.textContent=disp;
    var l=disp.replace(/[^0-9]/g,'').length;
    numEl.style.fontSize=l>10?'clamp(20px,5.5vw,28px)':l>7?'clamp(28px,7.5vw,38px)':'clamp(40px,11vw,58px)';
    var et=getExprTxt();
    exprEl.textContent=et||'\u00a0';
    exprEl.className=et&&et.trim()?'on':'';
    if(!justEvaled&&expr&&expr.length>1){
      var full=expr;for(var i=0;i<openParens;i++)full+=')';
      var r=safeEval(full);
      if(r!==null&&r!=='Err'&&fmtN(r)!==mn){liveEl.textContent='= '+fmtD(fmtN(r));liveEl.className='on';}
      else{liveEl.textContent='';liveEl.className='';}
    }else{liveEl.textContent='';liveEl.className='';}
    var obs=grid.querySelectorAll('.bo');
    for(var i=0;i<obs.length;i++){obs[i].classList.toggle('act',!justEvaled&&expr.length>0&&expr[expr.length-1]===obs[i].dataset.raw);}
  });
}

// \u2500\u2500 HAPTIC \u2500\u2500
function hap(s){if(!cfg.vib)return;if(navigator.vibrate)navigator.vibrate(s==='hvy'?40:s==='med'?20:10);}

// \u2500\u2500 HISTORY \u2500\u2500
function saveH(){try{localStorage.setItem('ch3',JSON.stringify(calcHist.slice(0,500)));}catch(e){}}
function renderH(){
  var badge=histBtn.querySelector('.hbadge');
  if(calcHist.length>0){
    if(!badge){var b=document.createElement('span');b.className='hbadge';b.textContent=calcHist.length;histBtn.appendChild(b);}
    else badge.textContent=calcHist.length;
  }else if(badge)badge.remove();
  if(!showHist)return;
  hCount.textContent=calcHist.length+' calculos';
  if(calcHist.length===0){hBody.innerHTML='<div class="h-empty">Nenhum calculo ainda</div>';return;}
  var html='';
  for(var i=0;i<calcHist.length;i++){
    var h=calcHist[i];if(!h||!h.expr)continue;
    html+='<div class="hi">';
    html+='<div class="hi-meta"><span class="hi-date">'+(h.date||'')+'</span><span class="hi-note-btn" data-ni="'+i+'">'+(h.note?'[nota]':'+ nota')+'</span></div>';
    html+='<div class="hi-expr">'+h.expr+'</div>';
    html+='<div class="hi-result">'+fmtD(h.result)+'</div>';
    if(h.note)html+='<div class="hi-note">'+h.note+'</div>';
    html+='<div class="hi-actions"><button class="hi-use" data-ui="'+i+'">usar</button><button class="hi-cpy" data-ci="'+i+'">copiar</button><button class="hi-del" data-di="'+i+'">excluir</button></div>';
    html+='</div>';
  }
  hBody.innerHTML=html;
}

document.getElementById('hClose').addEventListener('click',function(){showHist=false;histPanel.classList.remove('on');histBtn.classList.remove('active');});
var hClearModal=document.getElementById('hClearModal');
document.getElementById('hClearAll').addEventListener('click',function(){
  if(calcHist.length===0)return;
  hClearModal.style.display='flex';
});
document.getElementById('hClearCancel').addEventListener('click',function(){
  hClearModal.style.display='none';
});
document.getElementById('hClearConfirm').addEventListener('click',function(){
  hClearModal.style.display='none';
  calcHist=[];saveH();renderH();
  hap('hvy');
});
histBtn.addEventListener('click',function(){showHist=!showHist;histPanel.classList.toggle('on',showHist);histBtn.classList.toggle('active',showHist);if(showHist)renderH();});
hBody.addEventListener('click',function(e){
  if(e.target.dataset.ui!==undefined){
    var h=calcHist[+e.target.dataset.ui];if(!h)return;
    expr=h.result;justEvaled=true;lastResult=h.result;lastExpr=h.expr.replace(' =','');openParens=0;
    render();histPanel.classList.remove('on');histBtn.classList.remove('active');showHist=false;return;
  }
  if(e.target.dataset.ci!==undefined){
    var h=calcHist[+e.target.dataset.ci];if(!h)return;
    navigator.clipboard&&navigator.clipboard.writeText(h.result).then(function(){var orig=e.target.textContent;e.target.textContent='copiado!';setTimeout(function(){e.target.textContent=orig;},1500);});return;
  }

// \u2500\u2500 BACKSPACE \u2500\u2500
function bksp(){
  if(!expr)return;
  var ends=['sin(','cos(','tan(','asin(','acos(','atan(','log(','ln(','abs(','\u221a(','10x(','ex('];
  for(var i=0;i<ends.length;i++){if(expr.endsWith(ends[i])){expr=expr.slice(0,-ends[i].length);openParens=Math.max(0,openParens-1);return;}}
  var last=expr[expr.length-1];
  if(last==='(')openParens=Math.max(0,openParens-1);else if(last===')')openParens++;
  expr=expr.slice(0,-1);
}

// \u2500\u2500 HANDLE SCI \u2500\u2500
function handleSci(key){
  hap('lt');if(justEvaled){expr='';openParens=0;justEvaled=false;}
  var nm=expr&&!expr.match(/[+\-*\/\u00d7\u00f7\u2212(]$/);
  if(key==='pi'){if(nm)expr+='\u00d7';expr+='\u03c0';}
  else if(key==='e'){if(nm)expr+='\u00d7';expr+='e';}
  else if(key==='mod'){expr+=' mod ';}
  else if(key==='pow'){if(nm)expr+='\u00d7';expr+='(';}
  else{if(nm)expr+='\u00d7';expr+=key+'(';openParens++;}
  render();
}

// \u2500\u2500 HANDLE BASIC \u2500\u2500
function handle(key){
  hap(key==='='?'med':key==='AC'?'hvy':'lt');
  if(key==='AC'){expr='';justEvaled=false;lastResult='0';lastExpr='';openParens=0;render();return;}
  if(justEvaled){
    if(/^[0-9.]$/.test(key)){expr='';openParens=0;justEvaled=false;}
    else if(OPS.indexOf(key)>=0){expr=lastResult;openParens=0;justEvaled=false;}
    else justEvaled=false;
  }
  var opMap={'/':'\u00f7','*':'\u00d7','-':'\u2212','+':'+'};
  if(/^[0-9]$/.test(key)){
    if(expr.match(/[)\u00b2]$/))expr+='\u00d7';
    expr+=key;
  }else if(key==='.'){
    if(!expr||expr.match(/[+\-*\/\u00d7\u00f7\u2212(]$/))expr+='0';
    var lt=expr.match(/[0-9.]+$/);if(!lt||lt[0].indexOf('.')<0)expr+='.';
  }else if(key==='+/-'){
    var m=expr.match(/^(.*?)(-?[0-9]+\.?[0-9]*)$/);
    if(m){if(m[2][0]==='-')expr=m[1]+m[2].slice(1);else expr=m[1]+'-'+m[2];}
    else if(!expr)expr='-';
  }else if(key==='%'){
    if(!expr)return;
    var p=ltop();
    if(p>=0){
      var op=expr[p];
      if(op==='+'||op==='\u2212'){var lp=expr.substring(0,p),rp=expr.substring(p+1),lv=safeEval(lp),rn=parseFloat(rp);if(lv!==null&&lv!=='Err'&&!isNaN(rn))expr=lp+op+fmtN(lv*rn/100);}
      else{var nm2=expr.match(/(-?[0-9]+\.?[0-9]*)$/);if(nm2)expr=expr.substring(0,expr.length-nm2[1].length)+fmtN(parseFloat(nm2[1])/100);}
    }else{var nm3=expr.match(/(-?[0-9]+\.?[0-9]*)$/);if(nm3)expr=expr.substring(0,expr.length-nm3[1].length)+fmtN(parseFloat(nm3[1])/100);}
  }else if(OPS.indexOf(key)>=0){
    var dop=opMap[key]||key;
    if(!expr&&(key==='-'||key==='+'))expr='0';else if(!expr)return;
    if(expr.length>0&&'\u00f7\u00d7\u2212+'.indexOf(expr[expr.length-1])>=0)expr=expr.slice(0,-1);
    expr+=dop;
  }else if(key==='('){if(expr&&!expr.match(/[+\-*\/\u00d7\u00f7\u2212(]$/))expr+='\u00d7';expr+='(';openParens++;}
  else if(key===')'){if(openParens>0){expr+=')';openParens--;}}
  else if(key==='sqrt'){if(expr&&!expr.match(/[+\-*\/\u00d7\u00f7\u2212(]$/))expr+='\u00d7';expr+='\u221a(';openParens++;}
  else if(key==='x2'){if(expr.match(/[0-9)]$/))expr+='\u00b2';}
  else if(key==='back'){if(justEvaled){expr='';justEvaled=false;openParens=0;}else bksp();}
  else if(key==='='){
    if(!expr)return;
    var full=expr;for(var j=0;j<openParens;j++)full+=')';
    var r=safeEval(full);
    if(r!==null){
      var rs=r==='Err'?'Err':fmtN(r);
      lastExpr=full;lastResult=rs;justEvaled=true;openParens=0;
      if(r!=='Err'){
        var nd=new Date(),pad=function(n){return n<10?'0'+n:n;};
        calcHist.unshift({expr:full+' =',result:rs,date:pad(nd.getDate())+'/'+pad(nd.getMonth()+1)+' '+pad(nd.getHours())+':'+pad(nd.getMinutes()),note:''});
        if(calcHist.length>500)calcHist.pop();saveH();renderH();
      }
      numEl.classList.remove('bnc');void numEl.offsetWidth;numEl.classList.add('bnc');setTimeout(function(){numEl.classList.remove('bnc');},400);
    }
  }
  render();
}

// \u2500\u2500 BUILD GRID \u2500\u2500
function btype(k){if(OPS.indexOf(k)>=0||k==='=')return'bo';if(k==='AC'||k==='+/-'||k==='%')return'bf';if(k==='sqrt'||k==='x2'||k==='('||k===')')return'bx';if(k==='back')return'bb';return'bn';}
function addRipple(b){var r=document.createElement('span');r.className='ripple';b.appendChild(r);setTimeout(function(){r.remove();},350);}

function buildGrid(){
  grid.innerHTML='';
  for(var ri=0;ri<BASIC.length;ri++){
    for(var ci=0;ci<BASIC[ri].length;ci++){
      var key=BASIC[ri][ci];
      var btn=document.createElement('button');
      btn.className='btn '+btype(key);
      btn.textContent=DLBL[key]||key;
      btn.dataset.raw=key;
      (function(k){btn.addEventListener('click',function(){addRipple(this);handle(k);});})(key);
      grid.appendChild(btn);
    }
  }
}

function buildSci(){
  sciRow.innerHTML='';
  var sl={sin:'sin',cos:'cos',tan:'tan',pi:'\u03c0',asin:'asin',acos:'acos',atan:'atan',e:'e',log:'log',ln:'ln','10x':'10\u02e3',ex:'e\u02e3',abs:'abs',mod:'mod','x!':'x!',pow:'y\u02e3'};
  for(var ri=0;ri<SCI.length;ri++){
    for(var ci=0;ci<SCI[ri].length;ci++){
      var key=SCI[ri][ci];
      var btn=document.createElement('button');
      btn.className='bs';btn.textContent=sl[key]||key;
      (function(k){btn.addEventListener('click',function(){addRipple(this);handleSci(k);});})(key);
      sciRow.appendChild(btn);
    }
  }
}

// \u2500\u2500 SWIPE TO DELETE \u2500\u2500
document.addEventListener('touchstart',function(e){
  if(e.target.closest('.panel'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  txStart=e.touches[0].clientX;tyStart=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(txStart===null)return;
  var dx=txStart-e.changedTouches[0].clientX;
  var dy=Math.abs(e.changedTouches[0].clientY-(tyStart||0));
  if(dx>55&&dx>dy*1.8){hap('lt');bksp();render();}
  txStart=null;tyStart=null;
});

// \u2500\u2500 KEYBOARD \u2500\u2500
window.addEventListener('keydown',function(e){
  if(e.key>='0'&&e.key<='9')handle(e.key);
  else if(e.key==='+')handle('+');else if(e.key==='-')handle('-');
  else if(e.key==='*')handle('*');
  else if(e.key==='/'){e.preventDefault();handle('/');}
  else if(e.key==='%')handle('%');
  else if(e.key==='.'||e.key===',')handle('.');
  else if(e.key==='Enter'||e.key==='=')handle('=');
  else if(e.key==='Backspace')handle('back');
  else if(e.key==='Escape')handle('AC');
  else if(e.key==='(')handle('(');else if(e.key===')')handle(')');
});

// \u2500\u2500 INIT \u2500\u2500
applyTheme();if(cfg.wake)setWL(true);
