<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Calculadora</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<script>try{var _b=(localStorage.getItem('cbg')||'').split('|');if(_b[0]){document.documentElement.style.background=_b[0];if(_b[1]==='1'){document.documentElement.className='light';document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content','default');}}}catch(e){}</script>
<meta name="apple-mobile-web-app-title" content="Calculadora"/>
<meta name="theme-color" content="#0e0e0e"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg,#0e0e0e);touch-action:manipulation;-webkit-text-size-adjust:100%;}
body{display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;color:rgb(var(--fg));}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;outline:none;}
svg{display:block;}

/* ── MOLDURA ── */
#outer{position:fixed;inset:0;background:var(--brd);padding:2px;}
#app{position:absolute;inset:2px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;container-type:inline-size;}
@media(min-width:520px){
  #outer{position:relative;inset:auto;width:min(420px,96vw);height:min(880px,96vh);border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(var(--fg),.04);}
  #app{border-radius:32px;}
}

/* ── ORBS ── */
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;pointer-events:none;animation:drift 8s ease-in-out infinite alternate;will-change:transform;transform:translateZ(0);backface-visibility:hidden;}
.orb1{width:300px;height:300px;background:var(--o1);top:-90px;left:-70px;animation-duration:9s;}
.orb2{width:250px;height:250px;background:var(--o2);bottom:-70px;right:-70px;animation-duration:11s;animation-delay:-3s;opacity:.3;}
@keyframes drift{from{transform:translate3d(0,0,0);}to{transform:translate3d(25px,18px,0);}}

/* ── TOPO ── */
#top{position:relative;display:flex;align-items:center;gap:8px;padding:max(env(safe-area-inset-top),14px) 14px 10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--dot);box-shadow:0 0 10px var(--dot);flex-shrink:0;animation:breathe 2.8s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1;}50%{opacity:.35;}}
.bname{font-weight:800;font-size:13px;letter-spacing:.5px;color:rgba(var(--fg),.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seg{display:flex;background:rgba(var(--fg),.06);border:1px solid rgba(var(--fg),.08);border-radius:10px;padding:2px;flex-shrink:0;}
.seg button{font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;color:rgba(var(--fg),.45);transition:background .2s,color .2s;}
.seg button.on{background:var(--dot);color:var(--ontxt);}
.ibtn{position:relative;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(var(--fg),.06);border:1px solid rgba(var(--fg),.08);color:rgba(var(--fg),.7);flex-shrink:0;transition:background .2s,color .2s;}
.ibtn:active{transform:scale(.92);}
.ibtn svg{width:17px;height:17px;}
.hbadge{position:absolute;top:-5px;right:-5px;background:var(--dot);color:var(--ontxt);border-radius:9px;font-size:9px;font-weight:800;padding:2px 5px;min-width:17px;text-align:center;line-height:1.1;box-shadow:0 0 0 2px var(--bg);}

/* ── VISOR ── */
#screen{position:relative;background:var(--scr);border:1px solid var(--scrb);border-radius:24px;padding:14px 18px 12px;margin:0 12px 10px;min-height:136px;display:flex;flex-direction:column;justify-content:flex-end;flex-shrink:0;overflow:hidden;box-shadow:var(--inset);}
#screen::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.09) 50%,transparent 65%);transform:translateX(-110%);}
#screen.flash::after{animation:sheen .7s ease-out;}
@keyframes sheen{to{transform:translateX(110%);}}
#expr{display:flex;justify-content:flex-end;font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;color:rgba(var(--fg),.35);min-height:20px;}
#expr.on{color:var(--dot);opacity:.85;}
#numDisp{font-family:'DM Mono',monospace;font-weight:300;color:rgb(var(--fg));letter-spacing:-1.5px;line-height:1.05;text-align:right;white-space:nowrap;overflow:hidden;font-size:64px;cursor:pointer;text-shadow:0 0 28px var(--glow);margin-top:4px;}
@keyframes bnc{0%{transform:scale(1);}30%{transform:scale(1.08) translateY(-2px);}60%{transform:scale(.98);}100%{transform:scale(1);}}
#numDisp.bnc{animation:bnc .35s ease;transform-origin:right center;}
@keyframes shk{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(3px);}}
#numDisp.err{animation:shk .35s ease;color:#ff6b6b;}
.scr-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;min-height:22px;}
#cpyBtn{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.5px;color:rgba(var(--fg),.35);padding:4px 8px;border-radius:8px;border:1px solid rgba(var(--fg),.08);transition:color .2s,border-color .2s;}
#cpyBtn svg{width:12px;height:12px;}
#cpyBtn.ok{color:var(--dot);border-color:var(--dot);}
#live{flex:1;display:flex;justify-content:flex-end;font-family:'DM Mono',monospace;font-size:14px;color:var(--dot);opacity:0;white-space:nowrap;overflow:hidden;transition:opacity .15s;}
#live.on{opacity:.7;}

/* ── TECLADO ── */
#sciRow{display:none;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(34px,9cqw,42px);gap:7px;padding:0 12px 8px;flex-shrink:0;}
#sciRow.on{display:grid;}
#grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:clamp(7px,2.2cqw,10px);padding:0 12px max(env(safe-area-inset-bottom),14px);flex:1;min-height:0;contain:layout style;}
.btn,.bs{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:100%;-webkit-user-select:none;user-select:none;touch-action:pan-x;transition:transform .08s,box-shadow .08s,filter .08s;}
.btn{border-radius:22px;font-family:'DM Mono',monospace;font-weight:400;font-size:clamp(22px,7.4cqw,31px);}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:none !important;filter:brightness(1.12);}
.ripple{position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(var(--fg),.35);animation:rpl .3s ease-out forwards;pointer-events:none;}
@keyframes rpl{from{transform:scale(.4);opacity:1;}to{transform:scale(1.7);opacity:0;}}
.bn{background:linear-gradient(180deg,var(--num) 0%,var(--num2) 160%);color:var(--ntxt);box-shadow:0 4px 0 var(--num2),inset 0 1px 0 var(--numH);}
.bf{background:linear-gradient(180deg,var(--fn) 0%,var(--fn2) 160%);color:var(--ftxt);font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(15px,4.6cqw,19px);box-shadow:0 4px 0 var(--fn2),inset 0 1px 0 var(--fnH);}
.bx,.bb{background:linear-gradient(180deg,var(--ex) 0%,var(--ex2) 160%);color:var(--etxt);font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(15px,4.6cqw,19px);box-shadow:0 4px 0 var(--ex2),inset 0 1px 0 var(--exH);}
.bb svg{width:clamp(22px,6.5cqw,27px);height:auto;}
.bo{background:linear-gradient(180deg,var(--acc) 0%,var(--acc) 35%,var(--acc2) 170%);color:var(--optxt);font-size:clamp(26px,8.4cqw,35px);font-weight:300;box-shadow:0 4px 0 var(--acc2),0 0 22px rgba(0,0,0,.2),inset 0 1px 0 var(--accH);transition:transform .08s,box-shadow .08s,background .15s,color .15s;}
.bo.act{background:var(--actbg);color:var(--actfg);box-shadow:0 2px 0 var(--acc2),0 0 24px var(--acc);transform:translateY(2px);}
.bs{border-radius:14px;font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(11px,3.4cqw,14px);background:linear-gradient(180deg,var(--ex) 0%,var(--ex2) 160%);color:var(--etxt);box-shadow:0 3px 0 var(--ex2),inset 0 1px 0 var(--exH);}
.bs:active{transform:translateY(2px) scale(.97);box-shadow:none;filter:brightness(1.12);}

.beq{background:linear-gradient(180deg,var(--eq) 0%,var(--eq) 35%,var(--eq2) 170%);color:var(--eqtxt);box-shadow:0 4px 0 var(--eq2),0 0 22px rgba(0,0,0,.12),inset 0 1px 0 var(--accH);}
.light .orb{opacity:.55;}
.light .ripple{border-color:rgba(var(--fg),.18);}

/* ── PAINÉIS ── */
.panel{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:max(env(safe-area-inset-top),8px);opacity:0;pointer-events:none;transform:translateY(100%);transition:opacity .25s,transform .32s cubic-bezier(.4,0,.2,1);}
.panel::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 60% at 0% 0%,var(--o1),transparent 60%);opacity:.12;pointer-events:none;}
.panel.on{opacity:1;pointer-events:auto;transform:translateY(0);}
.ph{position:relative;display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(var(--fg),.07);}
.ph-title{flex:1;font-weight:800;font-size:18px;color:rgba(var(--fg),.9);}
.ph-sub{font-family:'DM Mono',monospace;font-size:11px;color:rgba(var(--fg),.35);}
.pbtn{font-size:11px;font-weight:700;padding:7px 12px;border-radius:10px;background:rgba(var(--fg),.07);border:1px solid rgba(var(--fg),.1);color:rgba(var(--fg),.75);}
.pbtn.danger{background:rgba(255,70,70,.1);border-color:rgba(255,70,70,.3);color:#ff8a80;}
.pbody{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px max(env(safe-area-inset-bottom),20px);}

/* histórico */
.hi{padding:12px 14px;margin-top:8px;border-radius:16px;background:rgba(var(--fg),.035);border:1px solid rgba(var(--fg),.06);}
.hi-meta{display:flex;justify-content:space-between;align-items:center;}
.hi-date{font-family:'DM Mono',monospace;font-size:10px;color:rgba(var(--fg),.3);}
.hi-expr{font-family:'DM Mono',monospace;font-size:12px;color:rgba(var(--fg),.4);text-align:right;word-break:break-all;margin-top:4px;}
.hi-result{font-family:'DM Mono',monospace;font-size:24px;font-weight:400;color:rgb(var(--fg));text-align:right;letter-spacing:-.5px;}
.hi-note{font-size:12px;color:var(--dot);text-align:right;margin-top:4px;font-style:italic;opacity:.85;word-break:break-word;}
.hi-note-inp{width:100%;background:rgba(var(--fg),.06);border:1px solid var(--scrb);border-radius:10px;color:rgb(var(--fg));font-family:'Syne',sans-serif;font-size:16px;padding:8px 10px;margin-top:8px;outline:none;}
.hi-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px;}
.hi-actions button{font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px;background:rgba(var(--fg),.06);border:1px solid rgba(var(--fg),.09);color:rgba(var(--fg),.7);}
.hi-actions .hi-use{background:var(--dot);border-color:transparent;color:var(--ontxt);}
.hi-actions .hi-del{color:#ff8a80;}
.h-empty{text-align:center;color:rgba(var(--fg),.3);font-size:14px;padding:60px 0;}
.h-empty svg{width:40px;height:40px;margin:0 auto 12px;opacity:.4;}

/* configurações */
.cs{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dot);opacity:.7;padding:18px 2px 8px;}
.card{border-radius:16px;background:rgba(var(--fg),.035);border:1px solid rgba(var(--fg),.06);padding:0 14px;}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid rgba(var(--fg),.05);}
.card .cr:last-child{border-bottom:none;}
.cl{font-size:14px;color:rgba(var(--fg),.85);}
.cl-d{font-size:14px;color:#ff8a80;}
.cr-d{cursor:pointer;}
.csel{appearance:none;-webkit-appearance:none;background:rgba(var(--fg),.07);border:1px solid rgba(var(--fg),.1);border-radius:9px;color:rgb(var(--fg));font-family:'Syne',sans-serif;font-size:13px;padding:7px 12px;outline:none;cursor:pointer;}
.ctog{position:relative;display:inline-block;width:48px;height:28px;flex-shrink:0;}
.ctog input{opacity:0;width:0;height:0;}
.cslider{position:absolute;inset:0;background:rgba(var(--fg),.15);border-radius:28px;transition:.25s;cursor:pointer;}
.cslider::before{content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 2px 4px rgba(0,0,0,.3);}
.ctog input:checked+.cslider{background:var(--dot);}
.ctog input:checked+.cslider::before{transform:translateX(20px);}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 0;}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;color:rgba(var(--fg),.5);}
.sw i{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(var(--fg),.08);transition:box-shadow .2s,transform .2s;}
.sw.on{color:rgb(var(--fg));}
.sw.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgb(var(--fg));transform:scale(1.05);}
.cfoot{text-align:center;font-size:11px;color:rgba(var(--fg),.25);padding:24px 0 6px;line-height:1.6;}

/* ── MODAL / TOAST ── */
.modal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal.on{opacity:1;pointer-events:auto;}
.mbox{width:100%;max-width:280px;background:var(--mbox);border:1px solid rgba(var(--fg),.1);border-radius:20px;padding:22px 18px 16px;text-align:center;transform:scale(.94);transition:transform .2s;}
.modal.on .mbox{transform:scale(1);}
.mtitle{font-weight:800;font-size:17px;margin-bottom:6px;}
.mmsg{font-size:13px;color:rgba(var(--fg),.5);margin-bottom:18px;}
.mrow{display:flex;gap:10px;}
.mrow button{flex:1;padding:11px 0;border-radius:12px;font-size:13px;font-weight:700;}
.mcancel{background:rgba(var(--fg),.08);color:rgba(var(--fg),.8);}
.mok{background:#e5484d;color:#fff;}
#toast{position:absolute;left:50%;bottom:calc(max(env(safe-area-inset-bottom),14px) + 12px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;background:rgba(24,24,26,.95);border:1px solid rgba(var(--fg),.12);color:#fff;font-size:12px;font-weight:700;padding:9px 16px;border-radius:20px;transition:opacity .2s,transform .25s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);}
#toast.on{opacity:1;transform:translate(-50%,0);}
.hsw{position:absolute;visibility:hidden;width:0;height:0;margin:0;pointer-events:none;}
label.btn,label.bs{cursor:pointer;}

@media(prefers-reduced-motion:reduce){.orb,.tdot,#screen.flash::after,#numDisp.err,#numDisp.bnc{animation:none;}}
</style>
</head>
<body>
<div id="outer">
<div id="app">
  <div class="orb orb1"></div><div class="orb orb2"></div>

  <header id="top">
    <div class="brand"><span class="tdot"></span><span class="bname">Calculadora</span></div>
    <div class="seg" id="modeSeg"><button data-m="0" class="on">Básica</button><button data-m="1">Científica</button></div>
    <button class="ibtn" id="histBtn" aria-label="Histórico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span class="hbadge" hidden></span></button>
    <button class="ibtn" id="cfgBtn" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <section id="screen">
    <div id="expr">&nbsp;</div>
    <div id="numDisp">0</div>
    <div class="scr-bot">
      <button id="cpyBtn" aria-label="Copiar resultado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>copiar</span></button>
      <div id="live"></div>
    </div>
  </section>

  <div id="sciRow"></div>
  <div id="grid"></div>

  <!-- HISTÓRICO -->
  <div class="panel" id="histPanel">
    <div class="ph">
      <span class="ph-title">Histórico</span>
      <span class="ph-sub" id="hCount"></span>
      <button class="pbtn danger" id="hClearAll">Limpar</button>
      <button class="pbtn" id="hClose">Fechar</button>
    </div>
    <div class="pbody" id="hBody"></div>
  </div>

  <!-- CONFIGURAÇÕES -->
  <div class="panel" id="cfgPanel">
    <div class="ph">
      <span class="ph-title">Configurações</span>
      <button class="pbtn" id="cClose">Fechar</button>
    </div>
    <div class="pbody">
      <div class="cs">Tema</div>
      <div class="card"><div class="themes" id="themeGrid"></div></div>
      <div class="cs">Preferências</div>
      <div class="card">
        <div class="cr"><span class="cl">Vibração</span><label class="ctog"><input type="checkbox" id="cVib"/><span class="cslider"></span></label></div>
        <div class="cr"><span class="cl">Manter tela ligada</span><label class="ctog"><input type="checkbox" id="cWake"/><span class="cslider"></span></label></div>
      </div>
      <div class="cs">Números</div>
      <div class="card">
        <div class="cr"><span class="cl">Separador decimal</span><select class="csel" id="cDec"><option value="comma">Vírgula (1,5)</option><option value="dot">Ponto (1.5)</option></select></div>
        <div class="cr"><span class="cl">Separador de milhar</span><select class="csel" id="cThou"><option value="dot">Ponto (1.000)</option><option value="comma">Vírgula (1,000)</option><option value="space">Espaço (1 000)</option><option value="none">Nenhum</option></select></div>
        <div class="cr"><span class="cl">Casas no resultado</span><select class="csel" id="cDPlaces"><option value="auto">Automático</option><option value="0">0</option><option value="2">2</option><option value="4">4</option><option value="6">6</option></select></div>
      </div>
      <div class="cs">Histórico</div>
      <div class="card"><div class="cr cr-d" id="cClearH"><span class="cl-d">Limpar todo o histórico</span><span style="color:#ff8a80;opacity:.6;">›</span></div></div>
      <div class="cfoot">Deslize pro lado pra apagar · Segure ⌫ pra limpar tudo<br/>Toque no número pra copiar</div>
    </div>
  </div>

  <!-- CONFIRMAÇÃO -->
  <div class="modal" id="modal">
    <div class="mbox">
      <div class="mtitle" id="mTitle"></div>
      <div class="mmsg" id="mMsg"></div>
      <div class="mrow"><button class="mcancel" id="mCancel">Cancelar</button><button class="mok" id="mOk">OK</button></div>
    </div>
  </div>

  <div id="toast"></div>
</div>
</div>

<script>
// ── LAYOUT ──

// ── MATEMÁTICA ──
function dc(n){var s=n.toString(),i=s.indexOf('.');return i<0?0:s.length-i-1;}
function prec(a,b,op){
  if(op==='/')return b?a/b:NaN;
  var f=Math.pow(10,Math.max(dc(a),dc(b)));
  var A=Math.round(a*f),B=Math.round(b*f);
  if(op==='+')return(A+B)/f;if(op==='-')return(A-B)/f;if(op==='*')return(A*B)/(f*f);return NaN;
}
function fact(n){n=Math.round(n);if(n<0||n>170)return NaN;var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function fmtN(n){
  if(!isFinite(n)||isNaN(n))return'Err';
  var s=parseFloat(n.toString());
  if(Math.abs(s)>=1e12)return s.toExponential(3);
  var r=parseFloat(s.toPrecision(10));
  var str=r.toString();
  return str.length>12?parseFloat(s.toPrecision(9)).toString():str;
}
// isRes=true só pra resultado (casas fixas não atrapalham enquanto digita)
function fmtD(n,isRes){
  if(n==='Err')return'Erro';
  if(n==='-')return n;
  n=String(n);
  if(n.indexOf('e')>=0){return n.replace('.',cfg.dec==='comma'?',':'.');}
  var neg=n[0]==='-',abs=neg?n.slice(1):n;
  if(isRes&&cfg.dp!=='auto'){var num=parseFloat(abs);if(!isNaN(num))abs=num.toFixed(parseInt(cfg.dp));}
  var pts=abs.split('.');
  var ip=pts[0];
  var ts=cfg.thou==='dot'?'.':cfg.thou==='comma'?',':cfg.thou==='space'?' ':'';
  if(ts)ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,ts);
  var ds=cfg.dec==='comma'?',':'.';
  return(neg?'−':'')+ip+(pts[1]!==undefined?ds+pts[1]:'');
}
// expressão bonita: números formatados e separador decimal certo
function fmtExpr(t){return t.replace(/\d+\.?\d*/g,function(m){return fmtD(m,false);});}

// ── AVALIAÇÃO SEGURA ──
function safeEval(e){
  if(!e)return null;
  var s=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')
         .replace(/√\(/g,'S(').replace(/π/g,'(3.14159265358979)')
         .replace(/\be\b/g,'(2.71828182845905)')
         .replace(/asin\(/g,'ASN(').replace(/acos\(/g,'ACS(').replace(/atan\(/g,'ATN(')
         .replace(/sin\(/g,'SN(').replace(/cos\(/g,'CS(').replace(/tan\(/g,'TN(')
         .replace(/log\(/g,'LG(').replace(/ln\(/g,'LN(').replace(/abs\(/g,'AB(')
         .replace(/10x\(/g,'TX(').replace(/ex\(/g,'EX(').replace(/x!\(/g,'FC(').replace(/mod/g,'%');
  var pos=0;
  var fns={'S(':function(v){return v>=0?Math.sqrt(v):NaN;},'SN(':function(v){return Math.sin(v*Math.PI/180);},'CS(':function(v){return Math.cos(v*Math.PI/180);},'TN(':function(v){return Math.tan(v*Math.PI/180);},'ASN(':function(v){return Math.asin(v)*180/Math.PI;},'ACS(':function(v){return Math.acos(v)*180/Math.PI;},'ATN(':function(v){return Math.atan(v)*180/Math.PI;},'LG(':function(v){return Math.log10(v);},'LN(':function(v){return Math.log(v);},'AB(':function(v){return Math.abs(v);},'TX(':function(v){return Math.pow(10,v);},'EX(':function(v){return Math.exp(v);},'FC(':function(v){return fact(v);}};
  var ks=Object.keys(fns);
  function pk(){return pos<s.length?s[pos]:null;}
  function primary(){
    if(pk()==='-'){pos++;return -power();}
    for(var i=0;i<ks.length;i++){if(s.indexOf(ks[i],pos)===pos){pos+=ks[i].length;var v=addSub();if(pk()===')'){pos++;}return post(fns[ks[i]](v));}}
    if(pk()==='('){pos++;var v=addSub();if(pk()===')'){pos++;}return post(v);}
    var ns='';while(pos<s.length&&/[0-9.]/.test(s[pos]))ns+=s[pos++];
    if(!ns||ns==='.')throw 0;
    return post(parseFloat(ns));
  }
  function post(v){while(pos<s.length&&s.charCodeAt(pos)===178){pos++;v=v*v;}return v;}
  function power(){var b=primary();if(pk()==='^'){pos++;var x=primary2();return Math.pow(b,x);}return b;}
  function primary2(){if(pk()==='-'){pos++;return -power();}return power();}
  function mulDiv(){var l=power();while(pk()==='*'||pk()==='/'||pk()==='%'){var op=s[pos++];var r=power();l=op==='%'?((l%r)+r)%r:prec(l,r,op);}return l;}
  function addSub(){var l=mulDiv();while(pk()==='+'||pk()==='-'){var op=s[pos++];var r=mulDiv();l=prec(l,r,op);}return l;}
  try{var r=addSub();if(pos<s.length)throw 0;return isFinite(r)&&!isNaN(r)?r:'Err';}catch(err){return null;}
}

// ── DISPLAY ──
var OPEND=/([+\-*\/×÷−(^]|mod)$/;
function ltop(){var d=0,p=-1;for(var i=0;i<expr.length;i++){var c=expr[i];if(c==='(')d++;else if(c===')')d--;else if(d===0&&'+-*/×÷−^'.indexOf(c)>=0&&i>0&&!(c==='-'&&/[+\-*\/×÷−^(d]/.test(expr[i-1])))p=i;else if(d===0&&c==='m'&&expr.substr(i,3)==='mod'){p=i+2;i+=2;}}return p;}
function getNum(){
  if(justEvaled)return lastResult;
  if(!expr)return'0';
  var lt=expr.substring(ltop()+1);if(!lt)return'0';
  var m=lt.match(/^(-?[0-9]*\.?[0-9]*)$/);if(m&&m[1]&&m[1]!=='-')return m[1];
  var r=safeEval(lt);return r!==null&&r!=='Err'?fmtN(r):(lt==='-'?'-':'0');
}
function getExprTxt(){
  if(justEvaled)return lastExpr+' =';
  if(!expr)return'';
  var p=ltop();if(p>=0)return expr.substring(0,p+1);
  if(expr.substring(1).match(/[^0-9.\-]/))return expr;
  return'';
}
function fitNum(txt){
  var len=Math.max(txt.length,1);
  numEl.style.fontSize='clamp(20px,'+(132/len).toFixed(2)+'cqw,64px)';
}

var _raf=false,_obsCache=null;
function render(){
  if(_raf)return;_raf=true;
  requestAnimationFrame(function(){
    _raf=false;
    var mn=getNum(),disp=fmtD(mn,justEvaled);
    numEl.textContent=disp;fitNum(disp);
    var et=getExprTxt();
    exprEl.textContent=et?fmtExpr(et):' ';
    exprEl.className=et?'on':'';
    var lv='';
    if(!justEvaled&&expr&&ltop()>=0||(!justEvaled&&expr&&/[^0-9.\-]/.test(expr.substring(1)))){
      var full=expr.replace(/([+\-*\/×÷−^]|mod)$/,'');for(var i=0;i<openParens;i++)full+=')';
      var r=safeEval(full);
      if(r!==null&&r!=='Err'&&fmtN(r)!==mn)lv='= '+fmtD(fmtN(r),true);
    }
    liveEl.textContent=lv;liveEl.className=lv?'on':'';
    if(!_obsCache)_obsCache=grid.querySelectorAll('.bo');
    var last=expr.length>0?expr[expr.length-1]:null;
    var map={'÷':'/','×':'*','−':'-','+':'+'};
    for(var j=0;j<_obsCache.length;j++){_obsCache[j].classList.toggle('act',!justEvaled&&map[last]===_obsCache[j].dataset.raw);}
  });
}

function copyTxt(t,done){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallbackCopy(t);done();});}
  else{fallbackCopy(t);done();}
}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}

function saveH(){try{localStorage.setItem('ch3',JSON.stringify(calcHist.slice(0,500)));}catch(e){}}
function renderBadge(){var n=calcHist.length;badge.hidden=!n;badge.textContent=n>99?'99+':n;}
function renderH(){

  if(!showHist)return;
  hCount.textContent=calcHist.length?calcHist.length+(calcHist.length===1?' cálculo':' cálculos'):'';
  $('hClearAll').style.display=calcHist.length?'':'none';
  if(!calcHist.length){hBody.innerHTML='<div class="h-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Nenhum cálculo ainda</div>';return;}
  var html='';
  for(var i=0;i<calcHist.length;i++){
    var h=calcHist[i];if(!h||!h.expr)continue;
    html+='<div class="hi" data-i="'+i+'">'+
      '<div class="hi-meta"><span class="hi-date">'+esc(h.date||'')+'</span></div>'+
      '<div class="hi-expr">'+esc(fmtExpr(h.expr))+'</div>'+
      '<div class="hi-result">'+esc(fmtD(h.result,true))+'</div>'+
      (h.note?'<div class="hi-note">'+esc(h.note)+'</div>':'')+
      '<div class="hi-actions"><button class="hi-del" data-a="del">excluir</button><button data-a="note">'+(h.note?'editar nota':'+ nota')+'</button><button data-a="cpy">copiar</button><button class="hi-use" data-a="use">usar</button></div>'+
      '</div>';
  }
  hBody.innerHTML=html;
}
function openHist(){showHist=true;histPanel.classList.add('on');renderH();}
function closeHist(){showHist=false;histPanel.classList.remove('on');}
function clearHist(){ask('Limpar histórico?','Isso não pode ser desfeito.','Limpar',function(){calcHist=[];saveH();renderH();hap('hvy');toast('Histórico limpo');});}

hBody.addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var card=b.closest('.hi'),idx=+card.dataset.i,h=calcHist[idx];if(!h)return;
  var a=b.dataset.a;hap('lt');
  if(a==='use'){expr=h.result;justEvaled=true;lastResult=h.result;lastExpr=h.expr.replace(/ =$/,'');openParens=0;render();closeHist();return;}
  if(a==='cpy'){var t=fmtD(h.result,true);copyTxt(t,function(){toast('✓ '+t+' copiado');});return;}
  if(a==='del'){calcHist.splice(idx,1);saveH();renderH();return;}
  if(a==='note'){
    var ex=card.querySelector('.hi-note-inp');if(ex){ex.focus();return;}
    var inp=document.createElement('input');inp.type='text';inp.className='hi-note-inp';inp.placeholder='Ex.: iPhone 13 da Maria';inp.value=h.note||'';inp.maxLength=80;
    card.appendChild(inp);inp.focus();
    var saved=false;
    var save=function(){if(saved)return;saved=true;calcHist[idx].note=inp.value.trim();saveH();renderH();};
    inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')save();else if(ev.key==='Escape'){saved=true;renderH();}});
    inp.addEventListener('blur',save);
  }
});

         inset:t.light?'inset 0 1px 4px rgba(0,0,0,.06)':'inset 0 2px 10px rgba(0,0,0,.45)'};

  var mtc=document.querySelector('meta[name="theme-color"]');if(mtc)mtc.setAttribute('content',t.bg);

// ── APAGAR ──
function bksp(){
  if(!expr)return;
  var ends=['asin(','acos(','atan(','sin(','cos(','tan(','log(','ln(','abs(','√(','10x(','ex(','x!(','mod'];
  for(var i=0;i<ends.length;i++){if(expr.endsWith(ends[i])){expr=expr.slice(0,-ends[i].length);if(ends[i]!=='mod')openParens=Math.max(0,openParens-1);return;}}
  var last=expr[expr.length-1];
  if(last==='(')openParens=Math.max(0,openParens-1);else if(last===')')openParens++;
  expr=expr.slice(0,-1);
}

// ── CIENTÍFICA ──
function handleSci(key){
  hap('lt');
  if(justEvaled){expr=(key==='pow'||key==='mod')&&lastResult!=='Err'?lastResult:'';openParens=0;justEvaled=false;}
  var nm=expr&&!OPEND.test(expr);
  if(key==='pi'){if(nm)expr+='×';expr+='π';}
  else if(key==='e'){if(nm)expr+='×';expr+='e';}
  else if(key==='mod'||key==='pow'){if(!nm){render();return;}expr+=key==='mod'?'mod':'^';}
  else{if(nm)expr+='×';expr+=key+'(';openParens++;}
  render();
}

function shakeErr(){hap('hvy');numEl.classList.remove('err');void numEl.offsetWidth;numEl.classList.add('err');setTimeout(function(){numEl.classList.remove('err');},400);}

// ── BÁSICA ──
function handle(key){
  hap(key==='='?'med':key==='AC'?'hvy':'lt');
  if(key==='AC'){expr='';justEvaled=false;lastResult='0';lastExpr='';openParens=0;render();return;}
  if(justEvaled){
    if(/^[0-9.]$/.test(key)||key==='('||key==='sqrt'){expr='';openParens=0;justEvaled=false;}
    else if(key!=='='){expr=lastResult==='Err'?'':lastResult;openParens=0;justEvaled=false;}
  }
  var opMap={'/':'÷','*':'×','-':'−','+':'+'};
  if(/^[0-9]$/.test(key)){
    if(/[)²πe]$/.test(expr))expr+='×';
    if(/(^|[^0-9.])0$/.test(expr))expr=expr.slice(0,-1);
    expr+=key;
  }else if(key==='.'){
    if(!expr||OPEND.test(expr))expr+='0';
    else if(/[)²πe]$/.test(expr))expr+='×0';
    var lt=expr.match(/[0-9.]+$/);if(!lt||lt[0].indexOf('.')<0)expr+='.';
  }else if(key==='+/-'){
    var m=expr.match(/^(.*?)(-?)([0-9]+\.?[0-9]*)$/);
    if(m){
      var pre=m[1];
      if(m[2]==='-')expr=pre+m[3];
      else expr=pre+'-'+m[3];
    }else if(!expr||(OPEND.test(expr)&&!/-$/.test(expr)))expr+='-';
    else if(/-$/.test(expr))expr=expr.slice(0,-1);
  }else if(key==='%'){
    if(!expr)return;
    var p=ltop();
    if(p>=0){
      var op=expr[p];
      if(op==='+'||op==='−'){var lp=expr.substring(0,p),rp=expr.substring(p+1),lv=safeEval(lp),rn=parseFloat(rp);if(lv!==null&&lv!=='Err'&&!isNaN(rn))expr=lp+op+fmtN(lv*rn/100);}
      else{var nm2=expr.match(/(-?[0-9]+\.?[0-9]*)$/);if(nm2)expr=expr.substring(0,expr.length-nm2[1].length)+fmtN(parseFloat(nm2[1])/100);}
    }else{var nm3=expr.match(/(-?[0-9]+\.?[0-9]*)$/);if(nm3)expr=expr.substring(0,expr.length-nm3[1].length)+fmtN(parseFloat(nm3[1])/100);}
  }else if(OPS.indexOf(key)>=0){
    var dop=opMap[key];
    if(!expr||expr==='-'){if(key==='-'){expr='-';render();return;}if(!expr)return;expr='';render();return;}
    if(/(\(|\^|mod)$/.test(expr)&&key==='-'){expr+='-';render();return;}
    if(/-$/.test(expr)&&OPEND.test(expr.slice(0,-1))){expr=expr.slice(0,-1);if(/\($/.test(expr)){render();return;}}
    if(/\($/.test(expr)){render();return;}
    if(/mod$/.test(expr))expr=expr.slice(0,-3);
    else if('÷×−+^'.indexOf(expr[expr.length-1])>=0)expr=expr.slice(0,-1);
    expr+=dop;
  }else if(key==='('){if(expr&&!OPEND.test(expr))expr+='×';expr+='(';openParens++;}
  else if(key===')'){if(openParens>0&&!OPEND.test(expr)){expr+=')';openParens--;}}
  else if(key==='sqrt'){if(expr&&!OPEND.test(expr))expr+='×';expr+='√(';openParens++;}
  else if(key==='x2'){if(/[0-9)πe]$/.test(expr))expr+='²';}
  else if(key==='back'){if(justEvaled){expr='';justEvaled=false;openParens=0;}else bksp();}
  else if(key==='='){
    if(!expr||justEvaled){render();return;}
    var full=expr.replace(/([+\-*\/×÷−^]|mod)$/,'');for(var j=0;j<openParens;j++)full+=')';
    var r=safeEval(full);
    if(r!==null){
      var rs=r==='Err'?'Err':fmtN(r);
      lastExpr=full;lastResult=rs;justEvaled=true;openParens=0;
      if(r!=='Err'){
        if(full!==rs){
          var nd=new Date(),pad=function(n){return n<10?'0'+n:n;};
          calcHist.unshift({expr:full+' =',result:rs,date:pad(nd.getDate())+'/'+pad(nd.getMonth()+1)+' '+pad(nd.getHours())+':'+pad(nd.getMinutes()),note:''});
          if(calcHist.length>500)calcHist.pop();saveH();renderH();
        }
        numEl.classList.remove('bnc');void numEl.offsetWidth;numEl.classList.add('bnc');setTimeout(function(){numEl.classList.remove('bnc');},350);
        screenEl.classList.remove('flash');void screenEl.offsetWidth;screenEl.classList.add('flash');setTimeout(function(){screenEl.classList.remove('flash');},700);
      }else shakeErr();
    }else shakeErr();
  }
  render();
}

// ── MONTAR TECLADO ──
function btype(k){if(k==='=')return'bo beq';if(OPS.indexOf(k)>=0)return'bo';if(k==='AC'||k==='+/-'||k==='%')return'bf';if(k==='sqrt'||k==='x2'||k==='('||k===')')return'bx';if(k==='back')return'bb';return'bn';}
function addRipple(b){
  var r=b._ripple;
  if(!r){
    r=document.createElement('span');r.className='ripple';b._ripple=r;
    r.addEventListener('animationend',function(){if(r.parentNode)r.parentNode.removeChild(r);});
  }else{
    if(r.parentNode)r.parentNode.removeChild(r);
    void r.offsetWidth;
  }
  b.appendChild(r);
}
function buildGrid(){
  grid.innerHTML='';_obsCache=null;
  for(var ri=0;ri<BASIC.length;ri++){
    for(var ci=0;ci<BASIC[ri].length;ci++){
      var key=BASIC[ri][ci];
      var btn=mkKey('btn '+btype(key));
      if(key==='back')btn.innerHTML=BACK_SVG;
      else btn.textContent=key==='.'?(cfg.dec==='comma'?',':'.'):(DLBL[key]||key);
      if(ARIA[key])btn.setAttribute('aria-label',ARIA[key]);
      btn.dataset.raw=key;addSw(btn);
      (function(k){
        var lpT=null,lpDone=false;
        btn.addEventListener('pointerdown',function(e){e.preventDefault();addRipple(this);
          if(k==='back'){lpDone=false;clearTimeout(lpT);lpT=setTimeout(function(){if(swiping)return;lpDone=true;handle('AC');toast('Tudo limpo');},550);}
        });
        btn.addEventListener('pointerup',function(){clearTimeout(lpT);if(swiping||lpDone){lpDone=false;return;}handle(k);});
        if(k==='back'){btn.addEventListener('pointercancel',function(){clearTimeout(lpT);});btn.addEventListener('pointerleave',function(){clearTimeout(lpT);});}
      })(key);
      grid.appendChild(btn);
    }
  }
}
function buildSci(){
  sciRow.innerHTML='';
  var sl={sin:'sin',cos:'cos',tan:'tan',pi:'π',asin:'sin⁻¹',acos:'cos⁻¹',atan:'tan⁻¹',e:'e',log:'log',ln:'ln','10x':'10ˣ',ex:'eˣ',abs:'|x|',mod:'mod','x!':'x!',pow:'xʸ'};
  for(var ri=0;ri<SCI.length;ri++){
    for(var ci=0;ci<SCI[ri].length;ci++){
      var key=SCI[ri][ci];
      var btn=mkKey('bs');btn.textContent=sl[key]||key;addSw(btn);
      (function(k){btn.addEventListener('pointerdown',function(e){e.preventDefault();addRipple(this);});btn.addEventListener('pointerup',function(){if(swiping)return;handleSci(k);});})(key);
      sciRow.appendChild(btn);
    }
  }
}

// ── DESLIZAR PRA APAGAR ──
document.addEventListener('touchstart',function(e){
  if(e.target.closest('.panel')||e.target.closest('.modal'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  txStart=e.touches[0].clientX;tyStart=e.touches[0].clientY;swiping=false;
  exprAtTouch=expr;justEvaledAtTouch=justEvaled;openParensAtTouch=openParens;
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(txStart===null)return;
  var dx=Math.abs(e.touches[0].clientX-txStart);
  var dy=Math.abs(e.touches[0].clientY-tyStart);
  if(!swiping&&dx>12&&dx>dy)swiping=true;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(txStart===null)return;
  var dx=txStart-e.changedTouches[0].clientX;
  var dy=Math.abs(e.changedTouches[0].clientY-(tyStart||0));
  if(dx>55&&dx>dy*1.8){hap('lt');bksp();render();}
  txStart=null;tyStart=null;
  setTimeout(function(){swiping=false;},0);
});

// ── TECLADO FÍSICO (Mac) ──
window.addEventListener('keydown',function(e){
  var tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
  if(e.metaKey||e.ctrlKey){if(e.key==='c'||e.key==='C'){e.preventDefault();copyCur();}return;}
  if(e.key==='Escape'){
    if(modal.classList.contains('on')){modal.classList.remove('on');return;}
    if(cfgPanel.classList.contains('on')){cfgPanel.classList.remove('on');return;}
    if(showHist){closeHist();return;}
    handle('AC');return;
  }
  if(showHist||cfgPanel.classList.contains('on')||modal.classList.contains('on'))return;
  var k=e.key;
  if(k>='0'&&k<='9')handle(k);
  else if(k==='+'||k==='-'||k==='*'||k==='%'||k==='('||k===')')handle(k);
  else if(k==='/'){e.preventDefault();handle('/');}
  else if(k==='x'||k==='X')handle('*');
  else if(k==='.'||k===',')handle('.');
  else if(k==='Enter'||k==='='){e.preventDefault();handle('=');}
  else if(k==='Backspace'||k==='Delete')handle('back');
  else if(k==='^')handleSci('pow');
});
